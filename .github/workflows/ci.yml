name: CI

# Runs the automated tests and the SonarQube scan on every code update.
# Everything runs against a local Supabase stack on the runner, never the cloud project.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit
      # Placeholder Supabase settings: without them the bundler drops the whole app behind
      # the "missing settings" guard in src/lib/supabase.ts and the build checks almost nothing.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-build-placeholder

  integration-e2e:
    name: Integration and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json
      # Same CLI version as local development, so `supabase status -o env` reports the keys write-env.mjs reads.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.98.1
      - name: Install dependencies
        run: |
          npm ci --prefix apps/backend
          npm ci --prefix apps/frontend
      - name: Start local Supabase and seed test data
        id: backend
        working-directory: apps/backend
        run: |
          supabase start
          npm run env
          npm run seed
      - name: Integration tests
        working-directory: apps/frontend
        run: npm run test:integration
      # E2E still runs when integration tests fail, so each suite reports its own result.
      - name: Install Playwright browser
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        working-directory: apps/frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        if: ${{ !cancelled() && steps.backend.outcome == 'success' }}
        working-directory: apps/frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/
          retention-days: 14
          if-no-files-found: ignore

  sonar:
    name: SonarQube scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pull requests from forks get no secrets, so the scan cannot sign in there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: Sonar needs it to tell new code from old.
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
