version: '3'

# task up    start Supabase + Express API (backend) + Vite dev server (frontend)
# task down  stop both
# task test  unit, integration, e2e

tasks:
  up:
    desc: Start backend (local Supabase + API) and frontend dev server
    cmds:
      - task: backend:up
      - task: backend:api:up
      - task: frontend:up

  down:
    desc: Stop frontend dev server and backend
    cmds:
      - task: frontend:down
      - task: backend:api:down
      - task: backend:down

  up:all:
    desc: Start EVERY service (backend, API, web app, Fern docs, Vitest UIs, k6 dashboard) and open them in the browser (OPEN=0 to skip opening)
    cmds:
      - task: up
      - task: docs:up
      - task: ui:up
      - task: k6:up
      - task: urls

  down:all:
    desc: Stop everything started by up:all, then the normal task down
    cmds:
      - lsof -ti tcp:3000,51204,51205,51206,5665 | xargs kill 2>/dev/null || true
      - pkill -f "fern-api docs dev" 2>/dev/null || true
      - pkill -x k6 2>/dev/null || true
      - task: down

  docs:up:
    desc: Start the Fern docs preview in the background (http://localhost:3000, first run downloads a bundle)
    dir: docs
    cmds:
      - npm install --silent
      - lsof -ti tcp:3000 | xargs kill 2>/dev/null || true
      - bash -c 'nohup npx fern-api docs dev > ../.docs.log 2>&1 < /dev/null & disown' > /dev/null 2>&1 < /dev/null
      - echo "docs http://localhost:3000 (log .docs.log)"

  ui:up:
    desc: Start the Vitest UIs in the background (frontend 51205, backend 51204, cross-app 51206)
    cmds:
      - lsof -ti tcp:51204,51205,51206 | xargs kill 2>/dev/null || true
      - bash -c 'cd apps/frontend && nohup npx vitest --ui --watch --open=false --api.port=51205 > ../../.vitest-frontend.log 2>&1 < /dev/null & disown' > /dev/null 2>&1 < /dev/null
      - bash -c 'cd apps/backend && nohup npx vitest --ui --watch --open=false --api.port=51204 > ../../.vitest-backend.log 2>&1 < /dev/null & disown' > /dev/null 2>&1 < /dev/null
      - bash -c 'cd tests && nohup npx vitest --ui --watch --open=false --api.port=51206 > ../.vitest-cross.log 2>&1 < /dev/null & disown' > /dev/null 2>&1 < /dev/null

  k6:up:
    desc: Start a 5 minute k6 load run in the background with the live dashboard (http://127.0.0.1:5665); skipped if k6 is missing
    dir: tests
    cmds:
      - |
        if ! command -v k6 >/dev/null 2>&1; then
          echo "WARN: k6 not found, skipping the dashboard (brew install k6)"
          exit 0
        fi
        lsof -ti tcp:5665 | xargs kill 2>/dev/null || true
        bash -c 'K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_PORT=5665 nohup k6 run --quiet --stage 30s:10,4m:25,30s:0 load/auth.js > ../.k6.log 2>&1 < /dev/null & disown' > /dev/null 2>&1 < /dev/null

  urls:
    desc: Wait for the services, print their URLs and open them in the browser (OPEN=0 to only print)
    silent: true
    cmds:
      - |
        wait_for() { for i in $(seq 1 60); do curl -s -o /dev/null "$1" && return 0; sleep 2; done; return 1; }
        vitest_url() { grep -m1 -o "http://localhost:$2/__vitest__/?token=[a-f0-9-]*" "$1" 2>/dev/null; }
        wait_for http://localhost:5173/ ; wait_for http://localhost:3001/health ; wait_for http://localhost:3000/
        sleep 3
        FRONT=$(vitest_url .vitest-frontend.log 51205); BACK=$(vitest_url .vitest-backend.log 51204); CROSS=$(vitest_url .vitest-cross.log 51206)
        URLS="http://localhost:5173 http://localhost:3001/health http://localhost:3000 $FRONT $BACK $CROSS"
        command -v k6 >/dev/null 2>&1 && URLS="$URLS http://127.0.0.1:5665"
        echo ""
        echo "SeatSure services"
        echo "  web app        http://localhost:5173"
        echo "  API            http://localhost:3001/health"
        echo "  Supabase       http://localhost:54321 (Studio http://localhost:54323)"
        echo "  Fern docs      http://localhost:3000"
        echo "  Vitest UI fe   ${FRONT:-http://localhost:51205 (still starting, see .vitest-frontend.log)}"
        echo "  Vitest UI be   ${BACK:-http://localhost:51204 (still starting, see .vitest-backend.log)}"
        echo "  Vitest UI x    ${CROSS:-http://localhost:51206 (still starting, see .vitest-cross.log)}"
        command -v k6 >/dev/null 2>&1 && echo "  k6 dashboard   http://127.0.0.1:5665 (5 minute run)"
        echo "  stop all:      task down:all"
        if [ "${OPEN:-1}" != "0" ]; then
          if command -v open >/dev/null 2>&1; then open $URLS; elif command -v xdg-open >/dev/null 2>&1; then for u in $URLS; do xdg-open "$u" >/dev/null 2>&1; done; fi
        fi

  test:
    desc: Run every level - unit, integration (frontend, backend, cross-app), e2e
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:e2e

  test:unit:
    desc: Unit tests, frontend and backend (no services needed)
    deps: [frontend:install]
    cmds:
      - cd apps/frontend && npm run test:unit
      - cd apps/backend && npm install --silent && npm run test:unit

  test:integration:
    desc: Integration - frontend (stubbed network), backend (real DB), cross-app (/tests)
    cmds:
      - task: test:integration:frontend
      - task: test:integration:backend
      - task: test:integration:cross

  test:integration:frontend:
    desc: Frontend adaptors over a stubbed network (no services needed)
    dir: apps/frontend
    deps: [frontend:install]
    cmds:
      - npm run test:integration

  test:integration:backend:
    desc: Backend RLS, RPC, concurrency against local Supabase
    dir: apps/backend
    deps: [backend:up]
    cmds:
      - npm run test:integration

  test:integration:cross:
    desc: Frontend adaptors against the real backend (/tests/integration)
    dir: tests
    deps: [backend:up]
    cmds:
      - npm install --silent
      - npm run integration

  test:e2e:
    desc: Playwright e2e (/tests/e2e) against the running app
    dir: tests
    deps: [backend:up]
    cmds:
      - npm install --silent
      - npx playwright install chromium
      - npm run e2e

  test:load:
    desc: k6 load tests (/tests/load) against the local API - needs task up
    dir: tests
    deps: [backend:up]
    cmds:
      - |
        if ! command -v k6 >/dev/null 2>&1; then
          echo "k6 not found, install it: brew install k6 (https://github.com/grafana/k6)"
          exit 1
        fi
      - k6 run load/smoke.js
      - k6 run load/auth.js
      - k6 run load/booking.js

  test:load:dashboard:
    desc: k6 auth load for 5 minutes with the live dashboard at http://127.0.0.1:5665 (needs task up)
    dir: tests
    deps: [backend:up]
    cmds:
      - K6_WEB_DASHBOARD=true K6_WEB_DASHBOARD_OPEN=true k6 run --stage 30s:10,4m:25,30s:0 load/auth.js

  test:ui:frontend:
    desc: Vitest UI for the frontend unit + integration tests (https://vitest.dev/guide/ui)
    dir: apps/frontend
    deps: [frontend:install]
    cmds:
      - npm run test:ui

  test:ui:backend:
    desc: Vitest UI for the backend unit + integration tests (integration needs task up)
    dir: apps/backend
    cmds:
      - npm run test:ui

  test:ui:cross:
    desc: Vitest UI for the cross-app integration tests in /tests (needs task up)
    dir: tests
    cmds:
      - npm run integration:ui

  backend:up:
    desc: Start local Supabase, write apps/frontend/.env.local, seed sample data
    dir: apps/backend
    cmds:
      - |
        if ! command -v supabase >/dev/null 2>&1; then
          echo "WARN: supabase CLI not found, skipping backend (install: brew install supabase/tap/supabase)"
          exit 0
        fi
        npm install --silent
        supabase status >/dev/null 2>&1 || supabase start
        npm run env
        npm run seed

  backend:api:up:
    desc: Start the Express API in the background (http://localhost:3001)
    dir: apps/backend
    cmds:
      - task: backend:api:down
      - npm install --silent
      - bash -c 'nohup npm run dev > ../../.backend.log 2>&1 < /dev/null & disown'
      - |
        for _ in $(seq 1 15); do
          lsof -ti tcp:3001 >/dev/null 2>&1 && { echo "api http://localhost:3001 (log .backend.log)"; exit 0; }
          sleep 0.2
        done
        echo "WARN: API did not start, see .backend.log"

  backend:api:down:
    desc: Stop the Express API
    cmds:
      - lsof -ti tcp:3001 | xargs kill 2>/dev/null || true
      # tsx watch outlives its child and would respawn it on the next file change
      - pkill -f 'apps/backend/node_modules/.bin/tsx watch' 2>/dev/null || true

  backend:down:
    desc: Stop local Supabase
    dir: apps/backend
    cmds:
      - |
        if command -v supabase >/dev/null 2>&1; then supabase stop; else echo "WARN: supabase CLI not found, nothing to stop"; fi

  backend:reset:
    desc: Rebuild the database from migrations and re-seed
    dir: apps/backend
    cmds:
      - supabase db reset
      - npm run seed

  backend:types:
    desc: Regenerate apps/backend/src/adaptor/supabase/database.types.ts after a schema change
    dir: apps/backend
    cmds:
      - supabase gen types typescript --local > src/adaptor/supabase/database.types.ts

  frontend:install:
    internal: true
    dir: apps/frontend
    sources: [package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  frontend:up:
    desc: Start the Vite dev server in the background (http://localhost:5173)
    dir: apps/frontend
    deps: [frontend:install]
    cmds:
      - task: frontend:down
      - bash -c 'nohup npm run dev -- --port 5173 --strictPort > ../../.frontend.log 2>&1 < /dev/null & disown'
      - echo "frontend http://localhost:5173 (log .frontend.log)"

  frontend:down:
    desc: Stop the Vite dev server
    cmds:
      - lsof -ti tcp:5173 | xargs kill 2>/dev/null || true

  docs:openapi:
    desc: Regenerate docs/fern/openapi/openapi.json from the endpoint registry (run after any API change)
    dir: apps/backend
    cmds:
      - npm install --silent
      - npm run docs:openapi

  docs:check:
    desc: Validate the Fern project (docs/fern) with fern check
    dir: docs
    cmds:
      - npm install --silent
      - npx fern-api check

  docs:dev:
    desc: Preview the docs locally with fern docs dev (http://localhost:3000)
    dir: docs
    cmds:
      - npm install --silent
      - npx fern-api docs dev

  docs:
    desc: Regenerate the OpenAPI spec, then validate the docs
    cmds:
      - task: docs:openapi
      - task: docs:check
