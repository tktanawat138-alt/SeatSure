version: '3'

# task up    start Supabase (backend) + Vite dev server (frontend)
# task down  stop both
# task test  unit, integration, e2e

tasks:
  up:
    desc: Start backend (local Supabase) and frontend dev server
    cmds:
      - task: backend:up
      - task: frontend:up

  down:
    desc: Stop frontend dev server and backend
    cmds:
      - task: frontend:down
      - task: backend:down

  test:
    desc: Run unit, integration and e2e tests
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:e2e

  test:unit:
    desc: Unit tests (no services needed)
    dir: apps/frontend
    deps: [frontend:install]
    cmds:
      - npm run test:unit

  test:integration:
    desc: Integration tests against local Supabase
    dir: apps/frontend
    deps: [frontend:install, backend:up]
    cmds:
      - npm run test:integration

  test:e2e:
    desc: Playwright e2e against the running app
    dir: apps/frontend
    deps: [frontend:install, backend:up]
    cmds:
      - npx playwright install chromium
      - npm run test:e2e

  backend:up:
    desc: Start local Supabase, write apps/frontend/.env.local, seed sample data
    dir: apps/backend
    cmds:
      - npm install --silent
      - supabase status >/dev/null 2>&1 || supabase start
      - npm run env
      - npm run seed

  backend:down:
    desc: Stop local Supabase
    dir: apps/backend
    cmds:
      - supabase stop

  backend:reset:
    desc: Rebuild the database from migrations and re-seed
    dir: apps/backend
    cmds:
      - supabase db reset
      - npm run seed

  backend:types:
    desc: Regenerate apps/frontend/src/lib/database.types.ts after a schema change
    dir: apps/backend
    cmds:
      - supabase gen types typescript --local > ../frontend/src/lib/database.types.ts

  frontend:install:
    internal: true
    dir: apps/frontend
    sources: [package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci

  frontend:up:
    desc: Start the Vite dev server in the background (http://localhost:5173)
    dir: apps/frontend
    deps: [frontend:install]
    cmds:
      - task: frontend:down
      - nohup npm run dev -- --port 5173 --strictPort > ../../.frontend.log 2>&1 & echo $! > ../../.frontend.pid
      - echo "frontend http://localhost:5173 (log .frontend.log)"

  frontend:down:
    desc: Stop the Vite dev server
    cmds:
      - |
        if [ -f .frontend.pid ]; then kill $(cat .frontend.pid) 2>/dev/null || true; rm -f .frontend.pid; fi
